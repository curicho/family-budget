<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Budget</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8e9ec; --muted:#9aa0ab; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; } h2 { font-size:16px; margin:24px 0 8px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin:12px 0; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid #2a2f3a; background:#11141a; color:var(--text); }
  button { background:var(--accent); border:none; cursor:pointer; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .big { font-size:32px; font-weight:650; }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:6px 4px; border-bottom:1px solid #242936; }
</style>
</head>
<body>
<main>
  <h1>Family Budget</h1>
  <div id="auth" class="card"></div>
  <div id="app" style="display:none">
    <div class="card">
      <div class="muted">Family net worth</div>
      <div class="big" id="nw-total">—</div>
      <table id="nw-members"></table>
    </div>

    <h2>Members</h2>
    <div class="card">
      <table id="members"></table>
      <div class="row">
        <input id="m-name" placeholder="Name">
        <label class="muted"><input type="checkbox" id="m-child"> child</label>
        <button onclick="addMember()">Add member</button>
      </div>
    </div>

    <h2>Transactions</h2>
    <div class="card" id="banking">
      <div class="row">
        <input type="file" id="csv-file" accept=".csv,.pdf,text/csv,application/pdf">
        <select id="csv-account"></select>
        <button onclick="importCsv()">Import statement</button>
      </div>
      <div class="muted" id="csv-note">CSV exports and text-based PDF statements from most UK banks are auto-detected. Re-importing the same file never duplicates.</div>
      <div class="row" style="margin-top:12px">
        <select id="txn-account-filter"><option value="">All accounts</option></select>
        <span class="muted" id="txn-summary"></span>
      </div>
      <table id="txns"></table>
    </div>

    <h2>Accounts</h2>
    <div class="card">
      <table id="accounts"></table>
      <div class="row">
        <input id="a-name" placeholder="Account name">
        <select id="a-type">
          <option>current</option><option>savings</option><option>credit_card</option>
          <option>isa</option><option>jisa</option><option>gia</option><option>sipp</option>
          <option>workplace_pension</option><option>crypto</option><option>property</option>
          <option>vehicle</option><option>other_asset</option><option>liability</option>
        </select>
        <select id="a-owner"></select>
        <button onclick="addAccount()">Add account</button>
      </div>
      <div class="row">
        <select id="v-account"></select>
        <input id="v-value" type="number" step="0.01" placeholder="Value £">
        <button onclick="addValuation()">Record valuation (today)</button>
      </div>
      <div class="muted">Phase 1: manual valuations. Bank feeds, investments and payslips arrive in later phases.</div>
    </div>
  </div>
</main>
<script>
let token = null;
const api = async (path, opts = {}) => {
  const r = await fetch('/api' + path, { ...opts,
    headers: { 'content-type': 'application/json',
               ...(token ? { authorization: 'Bearer ' + token } : {}) } });
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
};

function renderAuth(msg = '') {
  document.getElementById('auth').innerHTML = `
    <div class="row"><input id="email" placeholder="Email"><input id="pw" type="password" placeholder="Password">
    <button onclick="login()">Log in</button><button onclick="reg()">First-run: create user</button></div>
    <div class="muted">${msg}</div>`;
}
async function reg() {
  try { await api('/auth/register', { method:'POST', body: JSON.stringify(creds()) });
        renderAuth('User created — now log in.'); }
  catch (e) { renderAuth(e.message); }
}
async function login() {
  try { token = (await api('/auth/login', { method:'POST', body: JSON.stringify(creds()) })).token;
        document.getElementById('auth').style.display = 'none';
        document.getElementById('app').style.display = 'block'; refresh(); }
  catch (e) { renderAuth(e.message); }
}
const creds = () => ({ email: email.value, password: pw.value });

async function refresh() {
  const [members, accounts, nw] = await Promise.all([api('/members'), api('/accounts'), api('/networth')]);
  refreshBanking();
  document.getElementById('members').innerHTML =
    members.map(m => `<tr><td>${m.name}</td><td class="muted">${m.is_child ? 'child' : ''}</td></tr>`).join('');
  document.getElementById('accounts').innerHTML =
    accounts.map(a => `<tr><td>${a.name}</td><td class="muted">${a.type}</td></tr>`).join('');
  const owners = members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  document.getElementById('a-owner').innerHTML = owners;
  document.getElementById('v-account').innerHTML =
    accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  document.getElementById('csv-account').innerHTML =
    accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  document.getElementById('nw-total').textContent =
    '£' + Number(nw.total_gbp).toLocaleString('en-GB', { maximumFractionDigits: 0 });
  document.getElementById('nw-members').innerHTML =
    nw.by_member.map(r => `<tr><td>${r.name}</td><td style="text-align:right">£${Number(r.net_worth_gbp).toLocaleString('en-GB', { maximumFractionDigits: 0 })}</td></tr>`).join('');
}
async function addMember() {
  await api('/members', { method:'POST', body: JSON.stringify({ name: document.getElementById('m-name').value, is_child: document.getElementById('m-child').checked }) });
  refresh();
}
async function addAccount() {
  await api('/accounts', { method:'POST', body: JSON.stringify({
    name: document.getElementById('a-name').value,
    type: document.getElementById('a-type').value,
    owner_member_id: document.getElementById('a-owner').value }) });
  refresh();
}
async function addValuation() {
  await api('/valuations', { method:'POST', body: JSON.stringify({
    account_id: document.getElementById('v-account').value,
    as_of: new Date().toISOString().slice(0, 10),
    value_gbp: Number(document.getElementById('v-value').value) }) });
  refresh();
}
async function refreshBanking() {   // kept name so existing callers work
  try {
    const filter = document.getElementById('txn-account-filter').value;
    const txns = await api('/transactions?limit=100');
    const shown = filter ? txns.filter(t => t.account_name === filter) : txns;
    document.getElementById('txns').innerHTML = shown.map(t =>
      `<tr><td class="muted">${t.posted_at}</td><td>${t.description}</td>` +
      `<td class="muted">${t.account_name}</td>` +
      `<td style="text-align:right;color:${t.amount < 0 ? '#e88' : '#8e8'}">${Number(t.amount).toFixed(2)}</td></tr>`
    ).join('') || '<tr><td class="muted">No transactions yet — import a statement above.</td></tr>';
    const spend = shown.filter(t => t.amount < 0).reduce((s, t) => s + Number(t.amount), 0);
    const income = shown.filter(t => t.amount > 0).reduce((s, t) => s + Number(t.amount), 0);
    document.getElementById('txn-summary').textContent = shown.length
      ? `${shown.length} shown · in £${income.toFixed(2)} · out £${Math.abs(spend).toFixed(2)}`
      : '';
    const accounts = [...new Set(txns.map(t => t.account_name))];
    const sel = document.getElementById('txn-account-filter');
    const current = sel.value;
    sel.innerHTML = '<option value="">All accounts</option>' +
      accounts.map(a => `<option${a === current ? ' selected' : ''}>${a}</option>`).join('');
    sel.onchange = refreshBanking;
  } catch (e) {
    document.getElementById('txns').innerHTML =
      `<tr><td class="muted">Could not load transactions: ${e.message}</td></tr>`;
  }
}
async function importCsv() {
  const f = document.getElementById('csv-file').files[0];
  const note = document.getElementById('csv-note');
  if (!f) { note.textContent = 'Choose a CSV file first.'; return; }
  const fd = new FormData();
  fd.append('account_id', document.getElementById('csv-account').value);
  fd.append('file', f);
  note.textContent = 'Importing…';
  const r = await fetch('/api/import/csv', { method: 'POST', body: fd,
    headers: { authorization: 'Bearer ' + token } });
  const body = await r.json();
  if (!r.ok) { note.textContent = 'Import failed: ' + (body.detail || r.status); return; }
  note.textContent = `Imported ${body.imported} transactions` +
    (body.duplicates_skipped ? `, ${body.duplicates_skipped} duplicates skipped` : '') +
    (body.warnings.length ? ` — ${body.warnings.length} rows skipped (bad date/amount)` : '');
  refreshBanking();
}
renderAuth();
</script>
</body>
</html>
