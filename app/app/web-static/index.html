<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8B1E3F">
<title>Family Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F5F7;
  --ink: #1A1214;
  --panel: #FFFFFF;
  --border: #E7E0E3;
  --muted: #6F6870;
  --accent: #8B1E3F;
  --accent-press: #6B1530;
  --accent-ink: #ffffff;
  --blush: #F3E4E9;
  --blush-2: #F8ECF0;
  --good: #1F7A4D; --good-bg: #E7F5EC;
  --warn: #A3620A; --warn-bg: #FBF0DD;
  --bad: #B3261E; --bad-bg: #FBE9E7;
  --info: #2F5F8F; --info-bg: #E9F1F9;
  --radius-lg: 20px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(26,18,20,.04), 0 8px 24px rgba(26,18,20,.05);
  --font-display: "Fraunces", Georgia, serif;
  --font-ui: "DM Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --nav-h: 62px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 15px/1.5 var(--font-ui);
  font-variant-numeric: tabular-nums;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-weight: 700; margin: 0; font-family: var(--font-ui); letter-spacing: -.01em; }
h1 { font-size: 22px; }
h2 { font-size: 15.5px; margin-bottom: 12px; }
h3 { font-size: 13.5px; margin-bottom: 8px; }
p { margin: 0 0 8px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
hr.hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* ---------- auth ---------- */
.auth-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(720px 420px at 18% -8%, rgba(139,30,63,.16), transparent 60%),
    radial-gradient(600px 500px at 100% 100%, rgba(139,30,63,.08), transparent 60%),
    var(--paper);
}
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 36px 32px;
  animation: heroRise .5s cubic-bezier(.16,1,.3,1) both;
}
.auth-word { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.01em; margin-bottom: 4px; }
.auth-word .dot { color: var(--accent); }
.auth-card .tagline { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
.auth-card input { width: 100%; margin-bottom: 10px; }
.auth-card .stack { display: flex; flex-direction: column; gap: 10px; }
.auth-card button { width: 100%; }
.auth-card .btn-link { background: none; color: var(--accent); border: none; box-shadow: none; padding: 8px 0; width: auto; font-weight: 600; }
#authMsg { min-height: 18px; margin-bottom: 6px; }

/* ---------- app shell ---------- */
header.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.92);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto;
  display: flex; align-items: center; gap: 18px;
  padding: 12px 22px;
  height: var(--nav-h);
}
.brand-word { font-family: var(--font-display); font-weight: 700; font-size: 19px; white-space: nowrap; color: var(--ink); }
.brand-word .dot { color: var(--accent); }
.brand-link { display: flex; align-items: center; }
nav.nav { display: flex; gap: 2px; flex: 1; }
nav.nav a, .bottom-nav a {
  display: flex; align-items: center; gap: 7px;
  color: var(--muted); font-size: 13.5px; font-weight: 600;
  padding: 8px 13px; border-radius: 999px; white-space: nowrap;
  transition: background .15s ease, color .15s ease;
}
nav.nav a:hover { background: var(--blush-2); text-decoration: none; color: var(--ink); }
nav.nav a.active { background: var(--accent); color: var(--accent-ink); }
nav.nav a.active .nav-icon { color: var(--accent-ink); }
.nav-icon { width: 17px; height: 17px; flex-shrink: 0; }
#logoutBtn { flex-shrink: 0; }
.container { max-width: 1180px; margin: 0 auto; padding: 26px 22px 48px; }

.bottom-nav {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(255,255,255,.96);
  backdrop-filter: saturate(180%) blur(10px);
  border-top: 1px solid var(--border);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottom-nav a {
  flex: 1; flex-direction: column; gap: 3px;
  border-radius: 12px; padding: 6px 2px 5px; font-size: 11px;
  text-align: center;
}
.bottom-nav a.active { background: transparent; color: var(--accent); }
.bottom-nav a.active .nav-icon { color: var(--accent); }
.bottom-nav .nav-icon { width: 21px; height: 21px; }
.bottom-nav { display: none; }

@media (max-width: 860px) {
  nav.nav { display: none; }
  .bottom-nav { display: flex; }
  .container { padding: 18px 16px calc(90px + env(safe-area-inset-bottom)); }
  .topbar-inner { padding: 10px 16px; }
}

/* ---------- basic elements ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-bottom: 16px;
}
.card-flat { background: transparent; border: none; box-shadow: none; padding: 0; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12.5px; }
.big { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
.mid { font-size: 21px; font-weight: 700; }
.pill-list { display: flex; flex-wrap: wrap; gap: 7px; }

.page-head { margin-bottom: 18px; }
.page-head h1 { margin-bottom: 4px; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.back-link:hover { color: var(--accent); text-decoration: none; }

input, select, button, textarea {
  font: inherit; padding: 9px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: #fff; color: var(--ink);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { resize: vertical; }
button {
  background: var(--accent); color: var(--accent-ink); border: none;
  cursor: pointer; font-weight: 600; padding: 9px 16px;
  transition: background .12s ease, transform .08s ease;
}
button:hover { background: var(--accent-press); }
button:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
button.secondary:hover { background: var(--blush-2); }
button.danger { background: var(--bad); }
button.danger:hover { filter: brightness(1.08); }
button.ghost { background: none; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
button.ghost:hover { background: var(--blush-2); color: var(--ink); }
button.small, .row button.small { padding: 6px 11px; font-size: 12.5px; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }

/* ---------- badges / status ---------- */
.badge {
  display: inline-block; font-size: 11.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.badge-good { background: var(--good-bg); color: var(--good); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-bad { background: var(--bad-bg); color: var(--bad); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-muted { background: #F1EEF0; color: var(--muted); }
.badge-accent { background: var(--blush); color: var(--accent-press); }

/* ---------- progress bars ---------- */
.bar { height: 9px; border-radius: 999px; background: #EFE9EB; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .7s cubic-bezier(.16,1,.3,1); }
.bar.good .bar-fill { background: var(--good); }
.bar.warn .bar-fill { background: var(--warn); }
.bar.bad .bar-fill { background: var(--bad); }

/* ---------- segmented tabs ---------- */
.seg { display: inline-flex; gap: 3px; background: #EFEAEC; border-radius: 999px; padding: 4px; margin-bottom: 18px; }
.seg-btn { background: none; color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 7px 16px; border-radius: 999px; border: none; }
.seg-btn:hover { background: rgba(255,255,255,.6); color: var(--ink); }
.seg-btn.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.seg-btn.active:hover { background: var(--panel); }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.list-row { padding: 13px 4px; border-bottom: 1px solid var(--border); }
.list-row:last-child { border-bottom: none; }

.txn-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.txn-date { width: 58px; flex-shrink: 0; color: var(--muted); font-size: 12px; }
.txn-main { flex: 1; min-width: 140px; }
.txn-desc { font-weight: 600; font-size: 14px; }
.txn-meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
.txn-amt { font-weight: 700; font-size: 14.5px; white-space: nowrap; margin-left: auto; }
.amt-pos { color: var(--good); }
.amt-neg { color: var(--ink); }

.budget-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.budget-name { font-weight: 700; font-size: 14.5px; }
.budget-row-figures { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.budget-edit { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
.budget-edit input { width: 100px; text-align: right; }

.review-row-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.review-date { width: 58px; flex-shrink: 0; }
.review-desc { flex: 1; font-weight: 600; font-size: 14px; }
.review-amt { font-weight: 700; }
.review-row-fields { display: flex; gap: 8px; flex-wrap: wrap; }
.review-row-fields select, .review-row-fields input { flex: 1; min-width: 130px; }

/* ---------- empty states ---------- */
.empty-state { text-align: center; padding: 30px 14px; }
.empty-icon { font-size: 28px; margin-bottom: 8px; }
.empty-title { font-weight: 700; color: var(--ink); margin-bottom: 4px; font-size: 14.5px; }
.empty-desc { color: var(--muted); font-size: 13px; margin-bottom: 14px; max-width: 360px; margin-left: auto; margin-right: auto; }
.empty { color: var(--muted); font-size: 13.5px; padding: 8px 0; }

/* ---------- hero ---------- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(150deg, var(--blush) 0%, var(--blush-2) 55%, #FBF7F8 100%);
  border: 1px solid #EAD7DE;
  border-radius: var(--radius-lg);
  padding: 30px 28px 26px;
  margin-bottom: 20px;
}
.hero::before {
  content: ""; position: absolute; top: -60px; right: -60px; width: 240px; height: 240px;
  background: radial-gradient(circle, rgba(139,30,63,.14), transparent 70%);
  border-radius: 50%;
}
.hero-label { font-size: 13px; font-weight: 700; color: var(--accent-press); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.hero-amount {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em;
  font-size: 52px; line-height: 1.05; color: var(--ink);
  animation: heroRise .55s cubic-bezier(.16,1,.3,1) both;
}
.hero-pills { margin-top: 14px; position: relative; z-index: 1; }
.member-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.75); border: 1px solid #EAD7DE;
  padding: 5px 12px; border-radius: 999px; font-size: 12.5px; color: var(--ink);
}
.member-pill b { font-weight: 700; }
.hero-cta-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 22px; position: relative; z-index: 1; }
.spend-chip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spend-figure { font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.hero-btn { font-size: 14px; padding: 11px 20px; border-radius: 999px; box-shadow: 0 6px 18px rgba(139,30,63,.25); }

@keyframes heroRise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* ---------- misc widgets ---------- */
.attn-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.attn-row:last-child { border-bottom: none; }
.mini-budget-row { margin-bottom: 14px; }
.mini-budget-row:last-child { margin-bottom: 0; }
.insight-preview { font-size: 14px; line-height: 1.6; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.hbar-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; margin: 8px 0; font-size: 13px; }
.hbar-row .bar { height: 14px; }
.insight-card { border-left: 4px solid var(--info); }
.insight-card.sev-1, .insight-card.sev-2 { border-left-color: var(--bad); }
.insight-card.sev-3 { border-left-color: var(--warn); }
.insight-card.sev-4, .insight-card.sev-5 { border-left-color: var(--good); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 10px 0; }

/* ---------- more grid ---------- */
.more-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.more-card {
  display: flex; flex-direction: column; gap: 4px; position: relative;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 18px 20px 20px; box-shadow: var(--shadow); color: var(--ink);
  transition: transform .15s ease, box-shadow .15s ease;
}
.more-card:hover { text-decoration: none; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(26,18,20,.06), 0 14px 28px rgba(26,18,20,.08); }
.more-icon { font-size: 22px; margin-bottom: 6px; }
.more-title { font-weight: 700; font-size: 15px; }
.more-desc { color: var(--muted); font-size: 13px; }
.more-arrow { position: absolute; top: 18px; right: 18px; color: var(--muted); font-size: 15px; }

/* ---------- tables (dense fallback views) ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
td.right, th.right { text-align: right; }
tr:last-child td { border-bottom: none; }

/* ---------- motion ---------- */
.fade-in { animation: fadeIn .4s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 640px) {
  .hero-amount { font-size: 38px; }
  .big { font-size: 26px; }
  .card { padding: 16px 16px; }
  .budget-edit { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-word">Family Budget<span class="dot">.</span></div>
    <p class="tagline">Every pound, every plan, one household ledger.</p>
    <div id="authMsg" class="muted small"></div>
    <div class="stack">
      <input id="authEmail" type="email" placeholder="Email" autocomplete="username">
      <input id="authPw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="authLoginBtn">Log in</button>
      <button id="authRegisterBtn" class="btn-link">First run: create user</button>
    </div>
  </div>
</div>

<div id="appShell" style="display:none">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand-link" href="#home"><span class="brand-word">Family Budget<span class="dot">.</span></span></a>
      <nav class="nav" id="nav"></nav>
      <button class="ghost" id="logoutBtn">Log out</button>
    </div>
  </header>
  <main class="container" id="view"></main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script>
"use strict";

/* ============================== state & utils ============================== */

const TOKEN_KEY = "fb_token";

function readCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name.replace(/[$()*+.?[\\\]^{|}]/g, "\\$&") + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : null;
}

function setToken(token) {
  S.token = token || null;
  if (token) {
    localStorage.setItem(TOKEN_KEY, token);
    // Cookie backup (same-origin) — survives some private-mode / storage quirks
    document.cookie = `${TOKEN_KEY}=${encodeURIComponent(token)}; Path=/; Max-Age=${12 * 3600}; SameSite=Lax`;
  } else {
    localStorage.removeItem(TOKEN_KEY);
    document.cookie = `${TOKEN_KEY}=; Path=/; Max-Age=0; SameSite=Lax`;
  }
}

const S = {
  token: localStorage.getItem(TOKEN_KEY) || readCookie(TOKEN_KEY),
  members: [], accounts: [], categories: [],
  planTab: "budgets", moneyTab: "feed",
};

const HUBS = [
  { hash: "#home", label: "Home", icon: "home" },
  { hash: "#plan", label: "Plan", icon: "plan" },
  { hash: "#money", label: "Money", icon: "money" },
  { hash: "#wealth", label: "Wealth", icon: "wealth" },
  { hash: "#more", label: "More", icon: "more" },
];

const HUB_MAP = {
  "#home": "#home",
  "#plan": "#plan", "#budgets": "#plan", "#review": "#plan",
  "#money": "#money", "#txns": "#money", "#banking": "#money",
  "#wealth": "#wealth", "#assets": "#wealth",
  "#more": "#more", "#members": "#more", "#accounts": "#more", "#policies": "#more",
  "#payslips": "#more", "#trends": "#more", "#export": "#more", "#insights": "#more",
};

const ALIASES = {
  "#txns": "#money",
  "#budgets": "#plan",
  "#review": "#plan?tab=review",
  "#assets": "#wealth",
};

const ACCOUNT_TYPES = [
  "current", "savings", "credit_card", "isa", "jisa", "gia", "sipp",
  "workplace_pension", "crypto", "property", "vehicle", "other_asset", "liability",
];
const ASSET_TYPES = ["isa", "jisa", "gia", "sipp", "workplace_pension", "crypto",
                      "property", "vehicle", "other_asset", "liability"];
const INVESTMENT_TYPES = ["isa", "jisa", "gia", "sipp", "workplace_pension", "crypto"];
const POLICY_KINDS = [
  "life", "critical_illness", "income_protection", "home_buildings",
  "home_contents", "car", "travel", "private_medical", "health_cash_plan", "other",
];

const ICONS = {
  home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10v9.5h4.5v-6h2v6h4.5V10"/>',
  plan: '<rect x="4.5" y="3.5" width="15" height="17" rx="3"/><path d="M9 3.5v3M15 3.5v3"/><path d="M8 12.5l2.2 2.2L16 9.5"/>',
  money: '<rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10.5h19"/><path d="M6 15h4"/>',
  wealth: '<path d="M4 17.5 9.5 12l3.5 3.5L20 8"/><path d="M14.5 8H20v5.5"/>',
  more: '<circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/>',
};
function icon(name) {
  return `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ""}</svg>`;
}

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gbp = (v, dp = 0) => new Intl.NumberFormat("en-GB", {
  style: "currency", currency: "GBP", minimumFractionDigits: dp, maximumFractionDigits: dp,
}).format(Number(v || 0));
const fdate = s => {
  if (!s) return "—";
  const d = new Date(s);
  return Number.isNaN(d.getTime()) ? String(s) : d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
};
const daysUntil = s => Math.round((new Date(s) - new Date()) / 86400000);
const sel = (v, cur) => (cur !== null && cur !== undefined && String(v) === String(cur)) ? " selected" : "";
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthISO = () => new Date().toISOString().slice(0, 7);

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (!(opts.body instanceof FormData)) headers["content-type"] = "application/json";
  if (S.token) headers.authorization = "Bearer " + S.token;
  const r = await fetch("/api" + path, { ...opts, headers });
  if (r.status === 401 && !path.startsWith("/auth/")) {
    setToken(null);
    showLogin("Session expired — please log in again.");
    throw new Error("not authenticated");
  }
  if (r.status === 204) return null;
  let body = null;
  try { body = await r.json(); } catch { /* empty body */ }
  if (!r.ok) throw new Error((body && body.detail) || `${r.status} ${r.statusText}`);
  return body;
}

async function apiBlob(path) {
  const r = await fetch("/api" + path, { headers: S.token ? { authorization: "Bearer " + S.token } : {} });
  if (!r.ok) {
    let msg = `${r.status} ${r.statusText}`;
    try { msg = (await r.json()).detail || msg; } catch { /* not json */ }
    throw new Error(msg);
  }
  const cd = r.headers.get("content-disposition") || "";
  const m = /filename="?([^";]+)"?/.exec(cd);
  return { blob: await r.blob(), filename: m ? m[1] : null };
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function card(inner, cls = "") { return `<div class="card ${cls}">${inner}</div>`; }
function badge(text, kind = "muted") { return `<span class="badge badge-${kind}">${esc(text)}</span>`; }
function severityBadge(sev) {
  if (sev <= 2) return badge("high", "bad");
  if (sev === 3) return badge("medium", "warn");
  return badge("low", "good");
}
function emptyRow(msg) { return `<p class="empty">${esc(msg)}</p>`; }
function emptyState(icon, title, desc, ctaHtml = "") {
  return `<div class="empty-state">
    <div class="empty-icon">${icon}</div>
    <div class="empty-title">${esc(title)}</div>
    ${desc ? `<div class="empty-desc">${esc(desc)}</div>` : ""}
    ${ctaHtml}
  </div>`;
}
function pageHead(title, subtitle, backHash, backLabel) {
  return `<div class="page-head">
    ${backHash ? `<a class="back-link" href="${backHash}">‹ ${esc(backLabel || "Back")}</a>` : ""}
    <h1>${esc(title)}</h1>
    ${subtitle ? `<p class="muted">${esc(subtitle)}</p>` : ""}
  </div>`;
}
function progressBar(pct, kind) {
  const clamped = Math.max(0, Math.min(100, pct));
  return `<div class="bar ${kind}"><div class="bar-fill" data-pct="${clamped.toFixed(0)}" style="width:0%"></div></div>`;
}

/* small reusable option builders */
function memberOptions(selected, allowNone = true) {
  return (allowNone ? `<option value="">— none —</option>` : "") +
    S.members.map(m => `<option value="${m.id}"${sel(m.id, selected)}>${esc(m.name)}${m.is_child ? " (child)" : ""}</option>`).join("");
}
function accountOptions(selected, types = null) {
  const list = types ? S.accounts.filter(a => types.includes(a.type)) : S.accounts;
  return list.map(a => `<option value="${a.id}"${sel(a.id, selected)}>${esc(a.name)} · ${esc(a.type)}</option>`).join("");
}
function categoryOptions(selected, allowNone = true) {
  const parents = S.categories.filter(c => !c.parent_id);
  let html = allowNone ? `<option value="">— choose category —</option>` : "";
  for (const p of parents) {
    const kids = S.categories.filter(c => c.parent_id === p.id);
    if (kids.length) {
      html += `<optgroup label="${esc(p.name)}">`;
      html += `<option value="${p.id}"${sel(p.id, selected)}>${esc(p.name)} (general)</option>`;
      html += kids.map(k => `<option value="${k.id}"${sel(k.id, selected)}>${esc(k.name)}</option>`).join("");
      html += `</optgroup>`;
    } else {
      html += `<option value="${p.id}"${sel(p.id, selected)}>${esc(p.name)}</option>`;
    }
  }
  return html;
}
function categoryName(id) {
  const c = S.categories.find(c => c.id === id);
  return c ? c.name : null;
}

/* ============================== auth ============================== */

function authMsg(msg = "") { el("authMsg").textContent = msg; }

async function doRegister() {
  const email = el("authEmail").value.trim(), password = el("authPw").value;
  if (!email || !password) return authMsg("Enter an email and password first.");
  try {
    await api("/auth/register", { method: "POST", body: JSON.stringify({ email, password }) });
    authMsg("User created — now log in.");
  } catch (e) { authMsg(e.message); }
}

async function doLogin() {
  const email = el("authEmail").value.trim(), password = el("authPw").value;
  if (!email || !password) return authMsg("Enter an email and password first.");
  try {
    const res = await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    setToken(res.token);
    await bootstrap();
  } catch (e) { authMsg(e.message); }
}

function showLogin(msg = "") {
  el("appShell").style.display = "none";
  el("authScreen").style.display = "flex";
  authMsg(msg);
}

function doLogout() {
  if (S.token) {
    api("/auth/logout", { method: "POST" }).catch(() => {});
  }
  setToken(null);
  el("authPw").value = "";
  showLogin("");
  location.hash = "";
}

async function bootstrap() {
  el("authScreen").style.display = "none";
  el("appShell").style.display = "block";
  renderNav();
  try {
    const [members, accounts, categories] = await Promise.all([
      api("/members"), api("/accounts"), api("/categories").catch(() => []),
    ]);
    S.members = members || []; S.accounts = accounts || []; S.categories = categories || [];
  } catch (e) { /* individual screens will surface their own errors */ }
  if (!location.hash) location.hash = "#home";
  render();
}

/* ============================== router / nav ============================== */

function renderNav() {
  const html = HUBS.map(h => `<a href="${h.hash}" data-hub="${h.hash}">${icon(h.icon)}<span>${esc(h.label)}</span></a>`).join("");
  el("nav").innerHTML = html;
  el("bottomNav").innerHTML = html;
}
function highlightNav() {
  const base = (location.hash || "#home").split("?")[0];
  const hub = HUB_MAP[base] || base;
  document.querySelectorAll("#nav a, #bottomNav a").forEach(a => a.classList.toggle("active", a.dataset.hub === hub));
}

const ROUTES = {
  "#home": renderHome,
  "#plan": renderPlan,
  "#money": renderMoney,
  "#wealth": renderWealth,
  "#more": renderMore,
  "#members": renderMembers,
  "#accounts": renderAccounts,
  "#policies": renderPolicies,
  "#payslips": renderPayslips,
  "#trends": renderTrends,
  "#export": renderExport,
  "#insights": renderInsights,
  "#banking": renderBanking,
};

function mountView(html) {
  const view = el("view");
  view.innerHTML = html;
  view.classList.remove("fade-in");
  void view.offsetWidth; // restart animation
  view.classList.add("fade-in");
  requestAnimationFrame(() => {
    view.querySelectorAll(".bar-fill[data-pct]").forEach(b => { b.style.width = b.dataset.pct + "%"; });
  });
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

async function render() {
  if (!S.token) return;
  const raw = location.hash || "#home";
  const [base, query] = raw.split("?");
  if (ALIASES[base]) { location.hash = ALIASES[base]; return; }
  highlightNav();
  const params = new URLSearchParams(query || "");
  const fn = ROUTES[base] || renderHome;
  try {
    mountView(await fn(params));
  } catch (e) {
    mountView(card(`<p class="muted">Couldn't load this screen — ${esc(e.message)}.</p>`));
  }
}
window.addEventListener("hashchange", render);

function budgetMiniRow(b) {
  const budgetAmt = Number(b.amount_gbp || 0);
  const spent = Number(b.spent ?? b.spent_gbp ?? 0);
  const pct = budgetAmt > 0 ? Math.min(150, (spent / budgetAmt) * 100) : (spent > 0 ? 100 : 0);
  const kind = budgetAmt === 0 ? "" : (spent > budgetAmt ? "bad" : pct >= 85 ? "warn" : "good");
  return `<div class="mini-budget-row">
    <div class="spread"><span>${esc(b.category_name || b.category)}</span><span class="muted small">${gbp(spent, 0)}${budgetAmt ? " / " + gbp(budgetAmt, 0) : ""}</span></div>
    ${progressBar(Math.min(100, pct), kind)}
  </div>`;
}

async function renderHome() {
  const h = await api("/home");
  const nw = h.net_worth || {};
  const monthSpend = Number(h.month_spend ?? 0);
  const baseline = Number(h.baseline_spend ?? 0);
  const pct = baseline > 0 ? ((monthSpend - baseline) / baseline) * 100 : null;
  const spendKind = pct == null ? "muted" : (pct > 0 ? "bad" : "good");
  const uncategorised = h.uncategorised ?? h.uncategorised_count ?? 0;
  const staleAssets = h.stale_assets || [];
  const renewals = h.upcoming_renewals || [];
  const insightsPreview = h.insights_preview || [];

  let cta;
  if (uncategorised > 0) cta = { href: "#plan?tab=review", label: `Review ${uncategorised} uncategorised` };
  else if (staleAssets.length) cta = { href: "#wealth", label: `Update ${staleAssets.length} stale valuation${staleAssets.length === 1 ? "" : "s"}` };
  else if (renewals.length) cta = { href: "#policies", label: `Check ${renewals.length} renewal${renewals.length === 1 ? "" : "s"}` };
  else cta = { href: "#plan", label: "Review this month's plan" };

  const memberPills = (nw.by_member || []).map(m => `<span class="member-pill">${esc(m.name)} <b>${gbp(m.net_worth_gbp, 0)}</b></span>`).join("")
    || `<span class="muted small">Add household members on the More tab to see a breakdown.</span>`;

  let budgets = [];
  try { budgets = await api("/budgets?month=" + monthISO()); } catch { /* ignore, shown as empty state */ }
  const topBudgets = (budgets || []).slice()
    .sort((a, b) => Number(b.spent ?? b.spent_gbp ?? 0) - Number(a.spent ?? a.spent_gbp ?? 0))
    .slice(0, 4);

  const planCard = card(`
    <div class="spread"><h2>This month's plan</h2><a class="small" href="#plan">Open plan →</a></div>
    ${topBudgets.length ? topBudgets.map(budgetMiniRow).join("") :
      emptyState("🗂️", "No budgets set yet", "Set a spending limit per category and track progress here.", `<a href="#plan"><button class="small">Set a budget</button></a>`)}
  `);

  const attentionItems = [];
  if (uncategorised > 0) attentionItems.push(`<div class="attn-row"><span>🔎 <b>${uncategorised}</b> transaction${uncategorised === 1 ? "" : "s"} need a category</span><a href="#plan?tab=review"><button class="small">Review →</button></a></div>`);
  if (staleAssets.length) attentionItems.push(`<div class="attn-row"><span>📉 <b>${staleAssets.length}</b> asset${staleAssets.length === 1 ? "" : "s"} need a fresh valuation</span><a href="#wealth"><button class="small">Update →</button></a></div>`);
  if (renewals.length) attentionItems.push(`<div class="attn-row"><span>📅 <b>${renewals.length}</b> renewal${renewals.length === 1 ? "" : "s"} coming up</span><a href="#policies"><button class="small">View →</button></a></div>`);

  const attentionCard = card(`
    <h2>Needs attention</h2>
    ${attentionItems.length ? attentionItems.join("") : emptyState("✅", "All clear", "No uncategorised spending, stale assets or renewals right now.")}
  `);

  const insight = insightsPreview[0];
  const insightCard = card(`
    <div class="spread"><h2>Insight</h2><a class="small" href="#insights">See all →</a></div>
    ${insight ? `<div class="insight-preview">${severityBadge(insight.severity)} <b>${esc(insight.title)}</b>${insight.est_saving_gbp != null ? `<div class="muted small" style="margin-top:6px">save ~${gbp(insight.est_saving_gbp, 0)}</div>` : ""}</div>`
      : emptyState("💡", "No insights yet", "Run the rules engine to surface savings ideas.", `<a href="#insights"><button class="small">Run insights</button></a>`)}
  `);

  return `
    <div class="hero">
      <div class="hero-label">Family net worth</div>
      <div class="hero-amount">${gbp(nw.total_gbp ?? 0)}</div>
      <div class="pill-list hero-pills">${memberPills}</div>
      <div class="hero-cta-row">
        <div class="spend-chip">
          <span class="muted small">This month's spend</span>
          <span class="spend-figure">${gbp(monthSpend)}</span>
          ${pct != null ? badge((pct > 0 ? "+" : "") + pct.toFixed(0) + "% vs usual", spendKind) : ""}
        </div>
        <a href="${cta.href}"><button class="hero-btn">${esc(cta.label)}</button></a>
      </div>
    </div>
    <div class="grid grid-3">${planCard}${attentionCard}${insightCard}</div>
  `;
}

let _policiesCache = [];
async function editPolicy(id) {
  try {
    if (!_policiesCache.length) _policiesCache = await api("/policies");
    const p = _policiesCache.find(x => x.id === id);
    if (!p) return;
    el("policy-form-title").textContent = "Edit policy";
    el("p-id").value = p.id;
    el("p-kind").value = p.kind;
    el("p-provider").value = p.provider || "";
    el("p-holder").value = p.policyholder_member_id || "";
    el("p-cover").value = p.cover_amount ?? "";
    el("p-premium").value = p.premium ?? "";
    el("p-freq").value = p.premium_freq || "monthly";
    el("p-start").value = p.start_date || "";
    el("p-renewal").value = p.renewal_date || "";
    el("p-active").checked = !!p.active;
    el("p-cancel").style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) { el("policies-note").textContent = e.message; }
}
function resetPolicyForm() {
  el("policy-form-title").textContent = "Add a policy";
  ["p-id", "p-provider", "p-cover", "p-premium", "p-start", "p-renewal"].forEach(id => el(id).value = "");
  el("p-holder").value = ""; el("p-active").checked = true;
  el("p-cancel").style.display = "none";
}

async function savePolicy() {
  const note = el("policies-note");
  const id = el("p-id").value;
  const payload = {
    kind: el("p-kind").value,
    provider: el("p-provider").value.trim(),
    policyholder_member_id: el("p-holder").value || null,
    cover_amount: el("p-cover").value ? Number(el("p-cover").value) : null,
    premium: Number(el("p-premium").value || 0),
    premium_freq: el("p-freq").value,
    start_date: el("p-start").value || null,
    renewal_date: el("p-renewal").value || null,
    active: el("p-active").checked,
  };
  if (!payload.provider) { note.textContent = "Provider is required."; return; }
  try {
    if (id) await api(`/policies/${id}`, { method: "PATCH", body: JSON.stringify(payload) });
    else await api("/policies", { method: "POST", body: JSON.stringify(payload) });
    _policiesCache = [];
    render();
  } catch (e) { note.textContent = "Couldn't save — " + e.message; }
}

async function deletePolicy(id) {
  const p = (_policiesCache || []).find(x => x.id === id);
  if (!confirm(`Delete policy “${p ? p.provider : "this policy"}”?`)) return;
  try {
    await api(`/policies/${id}`, { method: "DELETE" });
    _policiesCache = [];
    render();
  } catch (e) {
    alert("Couldn't delete — " + e.message);
  }
}

    <div class="list-row txn-row">

        <div class="txn-desc">${esc(p.employer || "Payslip")}</div>
        <div class="txn-meta"><span>${fdate(p.pay_date)}</span><span>${esc((S.members.find(m => m.id === p.member_id) || {}).name || "")}</span></div>
      </div>
      <span class="txn-amt">${gbp(p.net_pay, 2)}</span>
      ${badge("confirmed", "good")}
    </div>`;
}

const PAYSLIP_FIELDS = [
  ["employer", "Employer", "text"], ["pay_date", "Pay date", "date"],
  ["period_start", "Period start", "date"], ["period_end", "Period end", "date"],
  ["tax_code", "Tax code", "text"], ["gross_pay", "Gross pay (£)", "number"],
  ["taxable_pay", "Taxable pay (£)", "number"], ["income_tax", "Income tax (£)", "number"],
  ["employee_ni", "Employee NI (£)", "number"], ["employer_ni", "Employer NI (£)", "number"],
  ["pension_employee", "Pension (employee) (£)", "number"], ["pension_employer", "Pension (employer) (£)", "number"],
  ["student_loan", "Student loan (£)", "number"], ["net_pay", "Net pay (£)", "number"],
];

function pendingPayslipRow(p) {
  const issues = (p.validation && p.validation.issues) || [];
  return `
    <div class="card" style="margin-bottom:12px;box-shadow:none;border-color:var(--border)">
      <div class="spread">
        <h3>${esc(p.employer || "Payslip")} — ${fdate(p.pay_date)}</h3>
        <span class="muted small">parsed via ${esc(p.parse_method || "?")} · confidence ${p.parse_confidence != null ? Math.round(p.parse_confidence * 100) + "%" : "—"}</span>
      </div>
      ${issues.length ? `<p class="muted small">⚠ ${esc(issues.join("; "))}</p>` : ""}
      <div class="form-grid">
        ${PAYSLIP_FIELDS.map(([key, label, type]) => `
          <div class="field"><label>${esc(label)}</label>
            <input id="ps-${p.id}-${key}" type="${type}" step="${type === "number" ? "0.01" : ""}" value="${esc(p[key] ?? "")}">
          </div>`).join("")}
        <div class="field"><label>Salary account</label><select id="ps-${p.id}-salary">${accountOptions(null, ["current", "savings"])}</select></div>
        <div class="field"><label>Pension account (optional)</label><select id="ps-${p.id}-pension"><option value="">— none —</option>${accountOptions(null, ["sipp", "workplace_pension"])}</select></div>
      </div>
      <div class="row">
        <button onclick="confirmPayslip('${p.id}')">Confirm &amp; post</button>
        <button class="danger" onclick="rejectPayslip('${p.id}')">Reject</button>
        <span id="ps-note-${p.id}" class="muted small"></span>
      </div>
    </div>`;
}

async function renderPayslips() {
  let list = [], loadError = "";
  try { list = await api("/payslips?status=" + payslipTab); }
  catch (e) { loadError = e.message; }

  const items = (list || []).map(p => payslipTab === "pending_review" ? pendingPayslipRow(p) : confirmedPayslipRow(p)).join("");

  return `
    ${pageHead("Payslips", "Upload, parse and post pay into the ledger.", "#more", "More")}
    ${card(`
      <h2>Upload a payslip</h2>
      <div class="row">
        <select id="pay-member">${memberOptions(null, false)}</select>
        <input type="file" id="pay-file" accept="application/pdf,.pdf">
        <button onclick="uploadPayslip()">Upload &amp; parse</button>
      </div>
      <p class="muted small" id="pay-upload-note">Text-based PDF payslips are parsed automatically; low-confidence extractions land in the review list below for correction.</p>
    `)}
    ${card(`
      <div class="seg">
        <button class="seg-btn ${payslipTab === "pending_review" ? "active" : ""}" onclick="payslipTab='pending_review';render()">Pending review</button>
        <button class="seg-btn ${payslipTab === "confirmed" ? "active" : ""}" onclick="payslipTab='confirmed';render()">Confirmed</button>
        <button class="seg-btn ${payslipTab === "rejected" ? "active" : ""}" onclick="payslipTab='rejected';render()">Rejected</button>
      </div>
      ${loadError ? emptyState("⚠️", "Couldn't load payslips", loadError) :
        items ? (payslipTab === "pending_review" ? items : `<div class="list">${items}</div>`) :
        emptyState("💷", "Nothing here yet", "Upload a payslip above to get started.")}
    `)}
  `;
}

async function uploadPayslip() {
  const note = el("pay-upload-note");
  const f = el("pay-file").files[0];
  if (!f) { note.textContent = "Choose a PDF first."; return; }
  const fd = new FormData();
  fd.append("member_id", el("pay-member").value);
  fd.append("file", f);
  note.textContent = "Uploading & parsing…";
  try {
    await api("/payslips/upload", { method: "POST", body: fd });
    payslipTab = "pending_review";
    render();
  } catch (e) { note.textContent = "Upload failed: " + e.message; }
}

function _payslipEdits(id) {
  const out = {};
  for (const [key, , type] of PAYSLIP_FIELDS) {
    const v = el(`ps-${id}-${key}`).value;
    out[key] = type === "number" ? (v === "" ? null : Number(v)) : (v || null);
  }
  return out;
}

async function confirmPayslip(id) {
  const note = el("ps-note-" + id);
  const salary_account_id = el(`ps-${id}-salary`).value;
  const pension_account_id = el(`ps-${id}-pension`).value || null;
  try {
    await api(`/payslips/${id}`, { method: "PATCH", body: JSON.stringify({ ..._payslipEdits(id), pension_account_id }) });
    await api(`/payslips/${id}/confirm`, { method: "POST", body: JSON.stringify({ salary_account_id, pension_account_id }) });
    render();
  } catch (e) { note.textContent = "Couldn't confirm — " + e.message; }
}

async function rejectPayslip(id) {
  if (!confirm("Reject this payslip? It will not post any ledger entries.")) return;
  try {
    await api(`/payslips/${id}/reject`, { method: "POST", body: JSON.stringify({}) });
    render();
  } catch (e) { el("ps-note-" + id).textContent = "Couldn't reject — " + e.message; }
}

/* ============================== Trends ============================== */

function lineChart(points, { width = 640, height = 180, pad = 28 } = {}) {
  if (!points.length) return emptyState("📊", "Not enough history yet", "Come back after a few valuations or statement imports.");
  const values = points.map(p => p.value);
  const min = Math.min(0, ...values), max = Math.max(...values, min + 1);
  const x = i => pad + (i / Math.max(1, points.length - 1)) * (width - pad * 2);
  const y = v => height - pad - ((v - min) / (max - min)) * (height - pad * 2);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = `${path} L${x(points.length - 1).toFixed(1)},${(height - pad).toFixed(1)} L${x(0).toFixed(1)},${(height - pad).toFixed(1)} Z`;
  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
        <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="var(--border)"/>
        <path d="${area}" fill="var(--blush)" stroke="none"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
        <text x="${pad}" y="${pad - 10}" font-size="11" fill="var(--muted)">${esc(points[0].label)}</text>
        <text x="${width - pad}" y="${pad - 10}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(points[points.length - 1].label)}</text>
      </svg>
      <div class="spread"><span class="muted small">${esc(points[0].label)}: ${gbp(points[0].value, 0)}</span><span class="muted small">${esc(points[points.length - 1].label)}: ${gbp(points[points.length - 1].value, 0)}</span></div>
    </div>`;
}

function hbarChart(items) {
  if (!items.length) return emptyState("📊", "No spending in this period", "Import statements or categorise transactions to see trends.");
  const max = Math.max(...items.map(i => i.value), 1);
  return items.map(i => `
    <div class="hbar-row">
      <span>${esc(i.label)}</span>
      ${progressBar((i.value / max) * 100, "")}
      <span class="right">${gbp(i.value, 0)}</span>
    </div>`).join("");
}

async function renderTrends() {
  let nwSeries = [], catSeries = [], err1 = "", err2 = "";
  try { nwSeries = await api("/trends/networth?days=365"); } catch (e) { err1 = e.message; }
  try { catSeries = await api("/trends/spend?months=6"); } catch (e) { err2 = e.message; }

  const points = (nwSeries || []).map(p => ({ label: String(p.date || p.month || p.snap_date || ""), value: Number(p.total_gbp ?? p.value_gbp ?? 0) }));
  const byCat = {};
  for (const c of (catSeries || [])) {
    const name = c.category || c.name || "—";
    byCat[name] = (byCat[name] || 0) + Number(c.amount ?? c.amount_gbp ?? c.total_gbp ?? 0);
  }
  const bars = Object.entries(byCat).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 10);

  return `
    ${pageHead("Trends", "Net worth and spending over time.", "#more", "More")}
    ${card(`<h2>Net worth history</h2>${err1 ? emptyState("⚠️", "Couldn't load net worth history", err1) : lineChart(points)}`)}
    ${card(`<h2>Top spending categories (last 6 months)</h2>${err2 ? emptyState("⚠️", "Couldn't load spend trends", err2) : hbarChart(bars)}`)}
  `;
}

/* ============================== Export ============================== */

function taxYearOptions() {
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), 3, 6); // 6 Apr
  const startYear = now >= cutoff ? now.getFullYear() : now.getFullYear() - 1;
  let opts = "";
  for (let i = 0; i < 8; i++) {
    const y = startYear - i;
    const label = `${y}-${String((y + 1) % 100).padStart(2, "0")}`;
    opts += `<option value="${label}">${label}</option>`;
  }
  return opts;
}

async function renderExport() {
  return `
    ${pageHead("Export", "Download the full ledger for a UK tax year.", "#more", "More")}
    ${card(`
      <h2>Export a tax year</h2>
      <p class="muted">Transactions, valuations, payslips, policies and holdings for a UK tax year (6 Apr – 5 Apr).</p>
      <div class="row">
        <select id="exp-year">${taxYearOptions()}</select>
        <select id="exp-fmt"><option value="json">JSON</option><option value="csv">CSV (zip)</option></select>
        <button onclick="downloadExport()">Download</button>
        <span id="exp-note" class="muted small"></span>
      </div>
    `)}
  `;
}

async function downloadExport() {
  const note = el("exp-note");
  const ty = el("exp-year").value, fmt = el("exp-fmt").value;
  note.textContent = "Preparing download…";
  try {
    const { blob, filename } = await apiBlob(`/export/${encodeURIComponent(ty)}?format=${fmt}`);
    triggerDownload(blob, filename || `family-budget-${ty}.${fmt === "json" ? "json" : "zip"}`);
    note.textContent = "Downloaded.";
  } catch (e) { note.textContent = "Export failed: " + e.message; }
}

/* ============================== Insights ============================== */

async function renderInsights() {
  let list = [], loadError = "";
  try { list = await api("/insights?status=open"); }
  catch (e) { loadError = e.message; }

  const cards = (list || []).map(i => `
    <div class="card insight-card sev-${i.severity}">
      <div class="spread">
        <h3>${severityBadge(i.severity)} ${esc(i.title)}</h3>
        ${i.est_saving_gbp != null ? `<span class="muted small">save ~${gbp(i.est_saving_gbp, 0)}</span>` : ""}
      </div>
      <p>${esc(i.body)}</p>
      <div class="row">
        <span class="muted small">${esc(i.kind)} · ${esc(i.source)} · ${fdate(i.created_at)}</span>
        <button class="small secondary" onclick="setInsight('${i.id}','done')">Mark done</button>
        <button class="small ghost" onclick="setInsight('${i.id}','dismissed')">Dismiss</button>
      </div>
    </div>`).join("");

  return `
    ${pageHead("Insights", "Automatic nudges and savings ideas.", "#more", "More")}
    <div class="spread" style="margin-bottom:12px">
      <button onclick="runInsightRules()">Run rules</button>
    </div>
    <div id="insights-note" class="muted small" style="margin-bottom:8px"></div>
    ${loadError ? emptyState("⚠️", "Couldn't load insights", loadError) :
      cards || emptyState("💡", "No open insights right now", "Run the rules engine to look for savings opportunities.")}
  `;
}

async function setInsight(id, status) {
  try {
    await api(`/insights/${id}`, { method: "PATCH", body: JSON.stringify({ status }) });
    render();
  } catch (e) { el("insights-note").textContent = "Couldn't update — " + e.message; }
}

async function runInsightRules() {
  const note = el("insights-note");
  note.textContent = "Running rules…";
  try {
    const res = await api("/insights/run", { method: "POST" });
    note.textContent = `Created ${res.created ?? 0} new insight(s).`;
    render();
  } catch (e) { note.textContent = "Couldn't run rules — " + e.message; }
}

/* ============================== wire-up ============================== */

el("authLoginBtn").addEventListener("click", doLogin);
el("authRegisterBtn").addEventListener("click", doRegister);
el("logoutBtn").addEventListener("click", doLogout);
el("authPw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

(async function boot() {
  if (!S.token) return;
  try {
    await api("/members"); // cheap auth check
    await bootstrap();
  } catch {
    setToken(null);
    showLogin("");
  }
})();
