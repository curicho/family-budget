<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Budget</title>
<style>
:root {
  --bg: #f4f1ea;
  --card: #ffffff;
  --border: #e6e1d3;
  --text: #23271f;
  --muted: #767b70;
  --accent: #2f6f4f;
  --accent-ink: #ffffff;
  --good: #1a7a44;
  --good-bg: #e7f5ec;
  --warn: #a3620a;
  --warn-bg: #fbf0dd;
  --bad: #b3261e;
  --bad-bg: #fbe9e7;
  --info: #2f5f8f;
  --info-bg: #e9f1f9;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(30,30,20,.05), 0 1px 8px rgba(30,30,20,.04);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 15px/1.5 -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-weight: 650; margin: 0; }
h1 { font-size: 19px; }
h2 { font-size: 15px; margin-bottom: 12px; }
h3 { font-size: 13px; margin-bottom: 8px; }
p { margin: 0 0 8px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- auth ---------- */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.auth-card {
  width: 100%;
  max-width: 360px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px 24px;
}
.auth-card h1 { margin-bottom: 4px; }
.auth-card .muted { margin-bottom: 20px; }
.auth-card input { width: 100%; margin-bottom: 10px; }
.auth-card .row { flex-direction: column; }
.auth-card button { width: 100%; }
.auth-card .btn-link { background: none; color: var(--accent); border: none; box-shadow: none; padding: 6px 0; width: auto; }

/* ---------- app shell ---------- */
header.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
nav.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
nav.nav a {
  color: var(--muted); font-size: 13px; font-weight: 600;
  padding: 6px 10px; border-radius: 8px; white-space: nowrap;
}
nav.nav a:hover { background: var(--bg); text-decoration: none; color: var(--text); }
nav.nav a.active { background: var(--accent); color: var(--accent-ink); }
.container { max-width: 1180px; margin: 0 auto; padding: 20px; }

/* ---------- basic elements ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 20px;
  margin-bottom: 16px;
}
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.mid { font-size: 22px; font-weight: 650; }
.hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.pill-list { display: flex; flex-wrap: wrap; gap: 6px; }

input, select, button, textarea {
  font: inherit; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff; color: var(--text);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { resize: vertical; }
button {
  background: var(--accent); color: var(--accent-ink); border: none;
  cursor: pointer; font-weight: 600; padding: 8px 14px;
}
button:hover { filter: brightness(1.08); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
button.danger { background: var(--bad); }
button.ghost { background: none; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
button.small, .row button.small { padding: 5px 9px; font-size: 12px; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
td.right, th.right { text-align: right; }
tr:last-child td { border-bottom: none; }
.amt-pos { color: var(--good); font-weight: 600; }
.amt-neg { color: var(--text); }

/* ---------- badges / status ---------- */
.badge {
  display: inline-block; font-size: 11.5px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.badge-good { background: var(--good-bg); color: var(--good); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-bad { background: var(--bad-bg); color: var(--bad); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-muted { background: #f0eee6; color: var(--muted); }

/* ---------- progress bars ---------- */
.bar { height: 8px; border-radius: 999px; background: #edeae0; overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; background: var(--accent); }
.bar.good > div { background: var(--good); }
.bar.warn > div { background: var(--warn); }
.bar.bad > div { background: var(--bad); }

/* ---------- misc widgets ---------- */
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); margin-bottom: 8px; }
.nudge.info { background: var(--info-bg); }
.nudge .msg { font-size: 13.5px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 8px 0; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.hbar-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; margin: 6px 0; font-size: 13px; }
.hbar-row .bar { height: 14px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { background: none; color: var(--muted); border: 1px solid var(--border); }
.tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.insight-card { border-left: 4px solid var(--info); }
.insight-card.sev-1, .insight-card.sev-2 { border-left-color: var(--bad); }
.insight-card.sev-3 { border-left-color: var(--warn); }
.insight-card.sev-4, .insight-card.sev-5 { border-left-color: var(--good); }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 10px 0; }
@media (max-width: 640px) {
  .big { font-size: 26px; }
  .container { padding: 14px; }
}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <h1>Family Budget</h1>
    <p class="muted">Sign in to your household ledger.</p>
    <div id="authMsg" class="muted small"></div>
    <div class="row">
      <input id="authEmail" type="email" placeholder="Email" autocomplete="username">
      <input id="authPw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="authLoginBtn">Log in</button>
      <button id="authRegisterBtn" class="btn-link">First run: create user</button>
    </div>
  </div>
</div>

<div id="appShell" style="display:none">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Family Budget</div>
      <nav class="nav" id="nav"></nav>
      <button class="ghost" id="logoutBtn">Log out</button>
    </div>
  </header>
  <main class="container" id="view"></main>
</div>

<script>
"use strict";

/* ============================== state & utils ============================== */

const S = { token: null, members: [], accounts: [], categories: [] };

const NAV = [
  ["#home", "Home"], ["#txns", "Transactions"], ["#review", "Review"],
  ["#budgets", "Budgets"], ["#assets", "Assets"], ["#policies", "Policies"],
  ["#payslips", "Payslips"], ["#trends", "Trends"], ["#export", "Export"],
  ["#members", "Members"], ["#accounts", "Accounts"], ["#banking", "Banking"],
  ["#insights", "Insights"],
];

const ACCOUNT_TYPES = [
  "current", "savings", "credit_card", "isa", "jisa", "gia", "sipp",
  "workplace_pension", "crypto", "property", "vehicle", "other_asset", "liability",
];
const ASSET_TYPES = ["isa", "jisa", "gia", "sipp", "workplace_pension", "crypto",
                      "property", "vehicle", "other_asset", "liability"];
const INVESTMENT_TYPES = ["isa", "jisa", "gia", "sipp", "workplace_pension", "crypto"];
const POLICY_KINDS = [
  "life", "critical_illness", "income_protection", "home_buildings",
  "home_contents", "car", "travel", "private_medical", "health_cash_plan", "other",
];

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gbp = (v, dp = 0) => new Intl.NumberFormat("en-GB", {
  style: "currency", currency: "GBP", minimumFractionDigits: dp, maximumFractionDigits: dp,
}).format(Number(v || 0));
const fdate = s => {
  if (!s) return "—";
  const d = new Date(s);
  return Number.isNaN(d.getTime()) ? String(s) : d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
};
const daysUntil = s => Math.round((new Date(s) - new Date()) / 86400000);
const sel = (v, cur) => (cur !== null && cur !== undefined && String(v) === String(cur)) ? " selected" : "";
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthISO = () => new Date().toISOString().slice(0, 7);

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (!(opts.body instanceof FormData)) headers["content-type"] = "application/json";
  if (S.token) headers.authorization = "Bearer " + S.token;
  const r = await fetch("/api" + path, { ...opts, headers });
  if (r.status === 204) return null;
  let body = null;
  try { body = await r.json(); } catch { /* empty body */ }
  if (!r.ok) throw new Error((body && body.detail) || `${r.status} ${r.statusText}`);
  return body;
}

async function apiBlob(path) {
  const r = await fetch("/api" + path, { headers: S.token ? { authorization: "Bearer " + S.token } : {} });
  if (!r.ok) {
    let msg = `${r.status} ${r.statusText}`;
    try { msg = (await r.json()).detail || msg; } catch { /* not json */ }
    throw new Error(msg);
  }
  const cd = r.headers.get("content-disposition") || "";
  const m = /filename="?([^";]+)"?/.exec(cd);
  return { blob: await r.blob(), filename: m ? m[1] : null };
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function card(inner, cls = "") { return `<div class="card ${cls}">${inner}</div>`; }
function badge(text, kind = "muted") { return `<span class="badge badge-${kind}">${esc(text)}</span>`; }
function severityBadge(sev) {
  if (sev <= 2) return badge("high", "bad");
  if (sev === 3) return badge("medium", "warn");
  return badge("low", "good");
}
function emptyRow(msg) { return `<p class="empty">${esc(msg)}</p>`; }

/* small reusable option builders */
function memberOptions(selected, allowNone = true) {
  return (allowNone ? `<option value="">— none —</option>` : "") +
    S.members.map(m => `<option value="${m.id}"${sel(m.id, selected)}>${esc(m.name)}${m.is_child ? " (child)" : ""}</option>`).join("");
}
function accountOptions(selected, types = null) {
  const list = types ? S.accounts.filter(a => types.includes(a.type)) : S.accounts;
  return list.map(a => `<option value="${a.id}"${sel(a.id, selected)}>${esc(a.name)} · ${esc(a.type)}</option>`).join("");
}
function categoryOptions(selected, allowNone = true) {
  const parents = S.categories.filter(c => !c.parent_id);
  let html = allowNone ? `<option value="">— choose category —</option>` : "";
  for (const p of parents) {
    const kids = S.categories.filter(c => c.parent_id === p.id);
    if (kids.length) {
      html += `<optgroup label="${esc(p.name)}">`;
      html += `<option value="${p.id}"${sel(p.id, selected)}>${esc(p.name)} (general)</option>`;
      html += kids.map(k => `<option value="${k.id}"${sel(k.id, selected)}>${esc(k.name)}</option>`).join("");
      html += `</optgroup>`;
    } else {
      html += `<option value="${p.id}"${sel(p.id, selected)}>${esc(p.name)}</option>`;
    }
  }
  return html;
}
function categoryName(id) {
  const c = S.categories.find(c => c.id === id);
  return c ? c.name : null;
}

/* ============================== auth ============================== */

function authMsg(msg = "") { el("authMsg").textContent = msg; }

async function doRegister() {
  const email = el("authEmail").value.trim(), password = el("authPw").value;
  if (!email || !password) return authMsg("Enter an email and password first.");
  try {
    await api("/auth/register", { method: "POST", body: JSON.stringify({ email, password }) });
    authMsg("User created — now log in.");
  } catch (e) { authMsg(e.message); }
}

async function doLogin() {
  const email = el("authEmail").value.trim(), password = el("authPw").value;
  if (!email || !password) return authMsg("Enter an email and password first.");
  try {
    const res = await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    S.token = res.token;
    await bootstrap();
  } catch (e) { authMsg(e.message); }
}

function doLogout() {
  S.token = null;
  el("appShell").style.display = "none";
  el("authScreen").style.display = "flex";
  el("authPw").value = "";
  authMsg("");
  location.hash = "";
}

async function bootstrap() {
  el("authScreen").style.display = "none";
  el("appShell").style.display = "block";
  renderNav();
  try {
    const [members, accounts, categories] = await Promise.all([
      api("/members"), api("/accounts"), api("/categories").catch(() => []),
    ]);
    S.members = members || []; S.accounts = accounts || []; S.categories = categories || [];
  } catch (e) { /* individual screens will surface their own errors */ }
  if (!location.hash) location.hash = "#home";
  render();
}

/* ============================== router / nav ============================== */

function renderNav() {
  el("nav").innerHTML = NAV.map(([hash, label]) => `<a href="${hash}">${esc(label)}</a>`).join("");
}
function highlightNav() {
  const h = location.hash || "#home";
  el("nav").querySelectorAll("a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === h));
}

const ROUTES = {
  "#home": renderHome, "#txns": renderTxns, "#review": renderReview,
  "#budgets": renderBudgets, "#assets": renderAssets, "#policies": renderPolicies,
  "#payslips": renderPayslips, "#trends": renderTrends, "#export": renderExport,
  "#members": renderMembers, "#accounts": renderAccounts, "#banking": renderBanking,
  "#insights": renderInsights,
};

async function render() {
  if (!S.token) return;
  highlightNav();
  const view = el("view");
  const hash = location.hash || "#home";
  const fn = ROUTES[hash] || renderHome;
  view.innerHTML = `<p class="empty">Loading…</p>`;
  try {
    view.innerHTML = await fn();
  } catch (e) {
    view.innerHTML = card(`<p class="muted">Couldn't load this screen — ${esc(e.message)}.</p>`);
  }
}
window.addEventListener("hashchange", render);

/* ============================== Home ============================== */

async function renderHome() {
  const h = await api("/home");
  const nw = h.net_worth || {};
  const monthSpend = Number(h.month_spend ?? 0);
  const baseline = Number(h.baseline_spend ?? 0);
  const pct = baseline > 0 ? ((monthSpend - baseline) / baseline) * 100 : null;
  const spendKind = pct == null ? "muted" : (pct > 0 ? "bad" : "good");

  const movers = (h.top_movers || []).map(m => `
    <tr>
      <td>${esc(m.category || m.name || "—")}</td>
      <td class="right">${gbp(m.this_month ?? m.amount_gbp ?? 0, 2)}</td>
      <td class="right">${m.delta != null ? badge((m.delta > 0 ? "+" : "") + Number(m.delta).toFixed(0), m.delta > 0 ? "bad" : "good") : "—"}</td>
    </tr>`).join("");

  const renewals = (h.upcoming_renewals || []).map(r => {
    const days = r.days ?? (r.renewal_date ? daysUntil(r.renewal_date) : null);
    const kind = days == null ? "muted" : (days <= 14 ? "bad" : days <= 30 ? "warn" : "info");
    return `<tr>
      <td>${esc(r.provider || "—")} <span class="muted small">${esc(r.kind || "")}</span></td>
      <td>${fdate(r.renewal_date)}</td>
      <td class="right">${r.premium != null ? gbp(r.premium, 2) : "—"}</td>
      <td class="right">${days != null ? badge(days + "d", kind) : "—"}</td>
    </tr>`;
  }).join("");

  const staleAssets = h.stale_assets || [];
  const uncategorised = h.uncategorised ?? h.uncategorised_count ?? 0;
  const insightsPreview = h.insights_preview || [];

  return `
    <div class="grid grid-2">
      ${card(`
        <h2>Net worth</h2>
        <div class="big">${gbp(nw.total_gbp ?? 0)}</div>
        <div class="pill-list" style="margin-top:10px">
          ${(nw.by_member || []).map(m => `<span class="badge badge-muted">${esc(m.name)}: ${gbp(m.net_worth_gbp, 0)}</span>`).join("") || `<span class="muted small">No members yet.</span>`}
        </div>
      `)}
      ${card(`
        <h2>This month's spend</h2>
        <div class="big">${gbp(monthSpend)}</div>
        <p class="muted">vs baseline ${gbp(baseline)}
          ${pct != null ? badge((pct > 0 ? "+" : "") + pct.toFixed(0) + "%", spendKind) : ""}
        </p>
      `)}
    </div>

    ${uncategorised > 0 ? `<div class="nudge"><span class="msg">🔎 <b>${uncategorised}</b> transactions need a category.</span><a href="#review"><button class="small">Review queue →</button></a></div>` : ""}
    ${staleAssets.length ? `<div class="nudge info"><span class="msg">📉 <b>${staleAssets.length}</b> asset${staleAssets.length === 1 ? "" : "s"} need a fresh valuation (${esc(staleAssets.slice(0, 3).map(a => a.name).join(", "))}${staleAssets.length > 3 ? "…" : ""}).</span><a href="#assets"><button class="small">Update →</button></a></div>` : ""}

    <div class="grid grid-2">
      ${card(`
        <h2>Top movers this month</h2>
        ${movers ? `<div class="table-wrap"><table><thead><tr><th>Category</th><th class="right">Spend</th><th class="right">Change</th></tr></thead><tbody>${movers}</tbody></table></div>` : emptyRow("No spending movement yet.")}
      `)}
      ${card(`
        <h2>Upcoming renewals</h2>
        ${renewals ? `<div class="table-wrap"><table><thead><tr><th>Policy</th><th>Renews</th><th class="right">Premium</th><th class="right">Due</th></tr></thead><tbody>${renewals}</tbody></table></div>` : emptyRow("Nothing renewing soon.")}
      `)}
    </div>

    ${card(`
      <div class="spread"><h2>Insights</h2><a href="#insights" class="small">See all →</a></div>
      ${insightsPreview.length ? insightsPreview.slice(0, 5).map(i => `
        <div class="row" style="justify-content:space-between">
          <span>${severityBadge(i.severity)} ${esc(i.title)}</span>
          ${i.est_saving_gbp != null ? `<span class="muted small">save ~${gbp(i.est_saving_gbp, 0)}</span>` : ""}
        </div>`).join("") : emptyRow("No open insights right now.")}
    `)}
  `;
}

/* ============================== Transactions ============================== */

let txnFilters = { account_id: "", category_id: "", member_id: "", uncategorised: false, q: "" };

async function renderTxns() {
  const params = new URLSearchParams({ limit: "150" });
  if (txnFilters.account_id) params.set("account_id", txnFilters.account_id);
  if (txnFilters.category_id) params.set("category_id", txnFilters.category_id);
  if (txnFilters.member_id) params.set("member_id", txnFilters.member_id);
  if (txnFilters.uncategorised) params.set("uncategorised", "true");
  if (txnFilters.q) params.set("q", txnFilters.q);

  let txns = [];
  let loadError = "";
  try { txns = await api("/transactions?" + params.toString()); }
  catch (e) { loadError = e.message; }

  const rows = (txns || []).map(t => `
    <tr>
      <td class="muted">${fdate(t.posted_at)}</td>
      <td>${esc(t.description)}${t.merchant ? `<div class="muted small">${esc(t.merchant)}</div>` : ""}</td>
      <td class="muted">${esc(t.account_name || "")}</td>
      <td>${t.category_name || categoryName(t.category_id) ? esc(t.category_name || categoryName(t.category_id)) : `<span class="muted">Uncategorised</span>`}</td>
      <td class="muted">${t.member_name || "—"}</td>
      <td class="right ${Number(t.amount) < 0 ? "amt-neg" : "amt-pos"}">${gbp(t.amount, 2)}</td>
    </tr>`).join("");

  return `
    ${card(`
      <div class="spread"><h2>Import a statement</h2></div>
      <div class="row">
        <input type="file" id="csv-file" accept=".csv,.pdf,text/csv,application/pdf">
        <select id="csv-account">${accountOptions(null, ["current", "savings", "credit_card"])}</select>
        <button onclick="importCsv()">Import bank statement</button>
      </div>

let budgetMonth = monthISO();

async function renderBudgets() {
  let rows = [], loadError = "";
  try { rows = await api("/budgets?month=" + budgetMonth); }
  catch (e) { loadError = e.message; }

  const body = (rows || []).map(r => {
    const budgetAmt = Number(r.amount_gbp || 0);
    const spent = Number(r.spent ?? r.spent_gbp ?? 0);
    const pct = budgetAmt > 0 ? Math.min(150, (spent / budgetAmt) * 100) : (spent > 0 ? 100 : 0);
    const kind = budgetAmt === 0 ? "" : (spent > budgetAmt ? "bad" : pct >= 85 ? "warn" : "good");
    return `
      <tr>
        <td>${esc(r.category_name || r.category)}</td>
        <td class="right">${gbp(spent, 2)}</td>
        <td class="right">
          <input type="number" step="0.01" min="0" style="width:100px;text-align:right" id="bud-${r.category_id}" value="${budgetAmt || ""}" placeholder="0">
        </td>
        <td class="right ${spent > budgetAmt && budgetAmt > 0 ? "amt-neg" : ""}">${budgetAmt ? gbp(budgetAmt - spent, 2) : "—"}</td>
        <td style="min-width:120px"><div class="bar ${kind}"><div style="width:${Math.min(100, pct)}%"></div></div></td>
        <td><button class="small" onclick="saveBudget('${r.category_id}')">Save</button></td>
      </tr>`;
  }).join("");

  return `
    ${card(`
      <div class="spread">
        <h2>Budgets</h2>
        <input type="month" value="${budgetMonth}" onchange="budgetMonth=this.value;renderBudgetsInto()">
      </div>
      <div id="budgets-note" class="muted small"></div>
      ${loadError ? emptyRow("Couldn't load budgets — " + loadError) :
        body ? `<div class="table-wrap"><table><thead><tr><th>Category</th><th class="right">Spent</th><th class="right">Budget (£)</th><th class="right">Remaining</th><th>Progress</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`

  `;
}

async function editPolicy(id) {

    el("p-provider").value = p.provider || "";
    el("p-holder").value = p.policyholder_member_id || "";
    el("p-cover").value = p.cover_amount ?? "";
    el("p-premium").value = p.premium ?? "";
    el("p-freq").value = p.premium_freq || "monthly";

  const payload = {

    provider: el("p-provider").value.trim(),

/* ============================== Trends ============================== */

function lineChart(points, { width = 640, height = 180, pad = 28 } = {}) {
  if (!points.length) return emptyRow("Not enough history yet.");
  const values = points.map(p => p.value);
  const min = Math.min(0, ...values), max = Math.max(...values, min + 1);
  const x = i => pad + (i / Math.max(1, points.length - 1)) * (width - pad * 2);
  const y = v => height - pad - ((v - min) / (max - min)) * (height - pad * 2);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = `${path} L${x(points.length - 1).toFixed(1)},${(height - pad).toFixed(1)} L${x(0).toFixed(1)},${(height - pad).toFixed(1)} Z`;
  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
        <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="var(--border)"/>
        <path d="${area}" fill="var(--good-bg)" stroke="none"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
        <text x="${pad}" y="${pad - 10}" font-size="11" fill="var(--muted)">${esc(points[0].label)}</text>
        <text x="${width - pad}" y="${pad - 10}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(points[points.length - 1].label)}</text>
      </svg>
      <div class="spread"><span class="muted small">${esc(points[0].label)}: ${gbp(points[0].value, 0)}</span><span class="muted small">${esc(points[points.length - 1].label)}: ${gbp(points[points.length - 1].value, 0)}</span></div>
    </div>`;
}

function hbarChart(items) {
  if (!items.length) return emptyRow("No spending in this period.");
  const max = Math.max(...items.map(i => i.value), 1);
  return items.map(i => `
    <div class="hbar-row">
      <span>${esc(i.label)}</span>
      <div class="bar"><div style="width:${Math.max(2, (i.value / max) * 100)}%"></div></div>
      <span class="right">${gbp(i.value, 0)}</span>
    </div>`).join("");
}

async function renderTrends() {
  let nwSeries = [], catSeries = [], err1 = "", err2 = "";
  try { nwSeries = await api("/trends/networth?days=365"); } catch (e) { err1 = e.message; }
  try { catSeries = await api("/trends/spend?months=6"); } catch (e) { err2 = e.message; }

  const points = (nwSeries || []).map(p => ({ label: String(p.date || p.month || p.snap_date || ""), value: Number(p.total_gbp ?? p.value_gbp ?? 0) }));
  const byCat = {};
  for (const c of (catSeries || [])) {
    const name = c.category || c.name || "—";
    byCat[name] = (byCat[name] || 0) + Number(c.amount ?? c.amount_gbp ?? c.total_gbp ?? 0);
  }
  const bars = Object.entries(byCat).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 10);

  return `
    ${card(`<h2>Net worth history</h2>${err1 ? emptyRow("Couldn't load — " + err1) : lineChart(points)}`)}
    ${card(`<h2>Top spending categories (last 6 months)</h2>${err2 ? emptyRow("Couldn't load — " + err2) : hbarChart(bars)}`)}
  `;
}

/* ============================== Export ============================== */

function taxYearOptions() {
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), 3, 6); // 6 Apr
  const startYear = now >= cutoff ? now.getFullYear() : now.getFullYear() - 1;
  let opts = "";
  for (let i = 0; i < 8; i++) {
    const y = startYear - i;
    const label = `${y}-${String((y + 1) % 100).padStart(2, "0")}`;
    opts += `<option value="${label}">${label}</option>`;
  }
  return opts;
}

async function renderExport() {
  return card(`
    <h2>Export a tax year</h2>
    <p class="muted">Download the full ledger — transactions, valuations, payslips, policies, holdings — for a UK tax year (6 Apr – 5 Apr).</p>
    <div class="row">
      <select id="exp-year">${taxYearOptions()}</select>
      <select id="exp-fmt"><option value="json">JSON</option><option value="csv">CSV (zip)</option></select>
      <button onclick="downloadExport()">Download</button>
      <span id="exp-note" class="muted small"></span>
    </div>
  `);
}

async function downloadExport() {
  const note = el("exp-note");
  const ty = el("exp-year").value, fmt = el("exp-fmt").value;
  note.textContent = "Preparing download…";
  try {
    const { blob, filename } = await apiBlob(`/export/${encodeURIComponent(ty)}?format=${fmt}`);
    triggerDownload(blob, filename || `family-budget-${ty}.${fmt === "json" ? "json" : "zip"}`);
    note.textContent = "Downloaded.";
  } catch (e) { note.textContent = "Export failed: " + e.message; }
}

/* ============================== Members ============================== */

async function renderMembers() {
  const rows = S.members.map(m => `
    <tr><td>${esc(m.name)}</td><td class="muted">${m.is_child ? "child" : "adult"}</td><td class="muted">${fdate(m.date_of_birth)}</td></tr>
  `).join("");
  return card(`
    <h2>Household members</h2>
    ${rows ? `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Date of birth</th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyRow("No members yet.")}
    <hr class="hr">
    <div class="row">
      <input id="m-name" placeholder="Name">
      <input id="m-dob" type="date">
      <label class="check"><input type="checkbox" id="m-child"> child</label>
      <button onclick="addMember()">Add member</button>
      <span id="members-note" class="muted small"></span>
    </div>
  `);
}

async function addMember() {
  const note = el("members-note");
  const name = el("m-name").value.trim();
  if (!name) { note.textContent = "Name is required."; return; }
  try {
    await api("/members", { method: "POST", body: JSON.stringify({
      name, is_child: el("m-child").checked, date_of_birth: el("m-dob").value || null,
    }) });
    S.members = await api("/members");
    el("view").innerHTML = await renderMembers();
  } catch (e) { note.textContent = "Couldn't add — " + e.message; }
}

/* ============================== Accounts ============================== */

async function renderAccounts() {
  const rows = S.accounts.map(a => `
    <tr>
      <td>${esc(a.name)}</td><td class="muted">${esc(a.type)}</td>
      <td class="muted">${(a.owners || []).map(o => (S.members.find(m => m.id === o.member_id) || {}).name).filter(Boolean).map(esc).join(", ") || "—"}</td>
      <td class="muted">${esc(a.currency)}</td>
    </tr>`).join("");
  return card(`
    <h2>Accounts</h2>
    ${rows ? `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Owner(s)</th><th>Currency</th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyRow("No accounts yet.")}
    <hr class="hr">
    <div class="row">
      <input id="a-name" placeholder="Account name">
      <select id="a-type">${ACCOUNT_TYPES.map(t => `<option value="${t}">${t}</option>`).join("")}</select>
      <select id="a-owner">${memberOptions(null, false)}</select>
      <label class="check"><input type="checkbox" id="a-liability"> liability</label>
      <button onclick="addAccount()">Add account</button>
      <span id="accounts-note" class="muted small"></span>
    </div>
  `);
}

async function addAccount() {
  const note = el("accounts-note");
  const name = el("a-name").value.trim();
  if (!name) { note.textContent = "Name is required."; return; }
  try {
    await api("/accounts", { method: "POST", body: JSON.stringify({
      name, type: el("a-type").value, owner_member_id: el("a-owner").value,
      is_liability: el("a-liability").checked,
    }) });
    S.accounts = await api("/accounts");
    el("view").innerHTML = await renderAccounts();
  } catch (e) { note.textContent = "Couldn't add — " + e.message; }
}

/* ============================== Banking ============================== */

async function renderBanking() {
  let status = { configured: false, connections: [] }, loadError = "";
  try { status = await api("/banking/status"); }
  catch (e) { loadError = e.message; }

  const conns = (status.connections || []).map(c => `
    <tr>
      <td>${esc(c.display_name)}<div class="muted small">${esc(c.aspsp_name || "")}</div></td>
      <td class="muted">${fdate(c.last_sync_at)} ${c.last_sync_status ? badge(c.last_sync_status, c.last_sync_status === "ok" ? "good" : "bad") : ""}</td>
      <td>${fdate(c.consent_expires_at)} ${c.expiring_soon ? badge("expiring soon", "warn") : ""}</td>
    </tr>`).join("");

  return `
    ${card(`
      <div class="spread"><h2>Bank connections</h2><button onclick="bankingSync()">Sync now</button></div>
      ${loadError ? emptyRow("Couldn't load banking status — " + loadError) :
        !status.configured ? emptyRow("Open Banking isn't configured on this server yet.") :
        conns ? `<div class="table-wrap"><table><thead><tr><th>Bank</th><th>Last sync</th><th>Consent</th></tr></thead><tbody>${conns}</tbody></table></div>` : emptyRow("No banks connected yet.")}
      <div id="banking-note" class="muted small"></div>
    `)}
    ${status.configured ? card(`
      <h2>Connect a new bank</h2>
      <div class="row">
        <input id="bank-country" value="GB" style="width:70px" maxlength="2">
        <button class="secondary" onclick="loadBanks()">Find banks</button>
      </div>
      <div id="bank-list" class="row"></div>
    `) : ""}
  `;
}

async function bankingSync() {
  const note = el("banking-note");
  note.textContent = "Syncing…";
  try {
    await api("/banking/sync", { method: "POST" });
    note.textContent = "Sync started.";
    el("view").innerHTML = await renderBanking();
  } catch (e) { note.textContent = "Sync failed — " + e.message; }
}

async function loadBanks() {
  const country = el("bank-country").value.trim() || "GB";
  const box = el("bank-list");
  box.innerHTML = `<span class="muted small">Loading banks…</span>`;
  try {
    const banks = await api(`/banking/banks?country=${encodeURIComponent(country)}`);
    const names = (banks || []).map(b => (typeof b === "string" ? b : (b.name || b.aspsp_name)));
    box.innerHTML = `
      <select id="bank-select">${names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select>
      <button onclick="connectBank('${esc(country)}')">Connect</button>`;
  } catch (e) { box.innerHTML = `<span class="muted small">Couldn't load banks — ${esc(e.message)}</span>`; }
}

async function connectBank(country) {
  try {
    const res = await api("/banking/connect", { method: "POST", body: JSON.stringify({
      aspsp_name: el("bank-select").value, country,
    }) });
    if (res.url) window.open(res.url, "_blank");
  } catch (e) { el("banking-note").textContent = "Couldn't start connection — " + e.message; }
}

/* ============================== Insights ============================== */

async function renderInsights() {
  let list = [], loadError = "";
  try { list = await api("/insights?status=open"); }
  catch (e) { loadError = e.message; }

  const cards = (list || []).map(i => `
    <div class="card insight-card sev-${i.severity}">
      <div class="spread">
        <h3>${severityBadge(i.severity)} ${esc(i.title)}</h3>
        ${i.est_saving_gbp != null ? `<span class="muted small">save ~${gbp(i.est_saving_gbp, 0)}</span>` : ""}
      </div>
      <p>${esc(i.body)}</p>
      <div class="row">
        <span class="muted small">${esc(i.kind)} · ${esc(i.source)} · ${fdate(i.created_at)}</span>
        <button class="small secondary" onclick="setInsight('${i.id}','done')">Mark done</button>
        <button class="small ghost" onclick="setInsight('${i.id}','dismissed')">Dismiss</button>
      </div>
    </div>`).join("");

  return `
    <div class="spread" style="margin-bottom:12px">
      <h2>Insights</h2>
      <button onclick="runInsightRules()">Run rules</button>
    </div>
    <div id="insights-note" class="muted small" style="margin-bottom:8px"></div>
    ${loadError ? emptyRow("Couldn't load insights — " + loadError) : (cards || emptyRow("No open insights right now."))}
  `;
}

async function setInsight(id, status) {
  try {
    await api(`/insights/${id}`, { method: "PATCH", body: JSON.stringify({ status }) });
    el("view").innerHTML = await renderInsights();
  } catch (e) { el("insights-note").textContent = "Couldn't update — " + e.message; }
}

async function runInsightRules() {
  const note = el("insights-note");
  note.textContent = "Running rules…";
  try {
    const res = await api("/insights/run", { method: "POST" });
    note.textContent = `Created ${res.created ?? 0} new insight(s).`;
    el("view").innerHTML = await renderInsights();
  } catch (e) { note.textContent = "Couldn't run rules — " + e.message; }
}
