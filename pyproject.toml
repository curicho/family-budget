[project]
name = "family-budget"
version = "0.1.0"
description = "Self-hosted UK household finance platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "croniter>=2.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
]

[project.scripts]
app = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
app = ["web-static/*"]
