apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fb.name" . }}-postgres
spec:
  serviceName: {{ include "fb.name" . }}-postgres
  replicas: 1
  selector: { matchLabels: { app: fb-postgres } }
  template:
    metadata: { labels: { app: fb-postgres } }
    spec:
      containers:
      - name: postgres
        image: {{ .Values.postgres.image }}
        env:
        - name: POSTGRES_DB
          value: budget
        - name: POSTGRES_USER
          value: budget
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD } }
        ports: [{ containerPort: 5432 }]
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
        resources: {{- toYaml .Values.postgres.resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      {{- with .Values.postgres.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
      resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fb.name" . }}-postgres
spec:
  selector: { app: fb-postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fb.name" . }}-redis
spec:
  replicas: 1
  selector: { matchLabels: { app: fb-redis } }
  template:
    metadata: { labels: { app: fb-redis } }
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        args: ["--appendonly", "yes"]
        ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fb.name" . }}-redis
spec:
  selector: { app: fb-redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fb.name" . }}-minio
spec:
  serviceName: {{ include "fb.name" . }}-minio
  replicas: 1
  selector: { matchLabels: { app: fb-minio } }
  template:
    metadata: { labels: { app: fb-minio } }
    spec:
      containers:
      - name: minio
        image: {{ .Values.minio.image }}
        args: ["server", "/data"]
        env:
        - name: MINIO_ROOT_USER
          value: budget
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: MINIO_ROOT_PASSWORD } }
        ports: [{ containerPort: 9000 }]
        volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: {{ .Values.minio.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fb.name" . }}-minio
spec:
  selector: { app: fb-minio }
  ports: [{ port: 9000 }]
---
# One-shot bucket creation
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fb.name" . }}-minio-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        env:
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: MINIO_ROOT_PASSWORD } }
        command: ["/bin/sh","-c"]
        args:
        - |
          mc alias set local http://{{ include "fb.name" . }}-minio:9000 budget "$MINIO_ROOT_PASSWORD"
          {{- range .Values.minio.buckets }}
          mc mb --ignore-existing local/{{ . }}
          {{- end }}
